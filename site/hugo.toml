# 한지원 포트폴리오 사이트 운영 설정
# 배포 빌드는 .github-pages.json 의 "config": "hugo.toml,pages.json" 순서로 읽습니다.
# (뒤에 오는 pages.json 이 baseURL·theme 등 배포용 값을 덮어씁니다.)

baseURL = "https://won-ji1.github.io/portfolio/"
title = "한지원"
languageCode = "ko-KR"
defaultContentLanguage = "ko"

# 사용하지 않는 태그·카테고리 페이지는 만들지 않음 (빈 목록 페이지·빈 링크 방지)
disableKinds = ["taxonomy", "term"]

copyright = "© 2026 한지원"

[params]
env = "production"
description = "로스쿨 진학을 준비하며 IT 변호사를 목표로 하는 한지원의 포트폴리오"
author = "한지원"
defaultTheme = "auto"
ShowBreadCrumbs = true
ShowToc = true
TocOpen = true
ShowReadingTime = false
ShowWordCount = false
ShowShareButtons = false
ShowPostNavLinks = false
ShowCodeCopyButtons = false
hideSummary = false
mainSections = ["activities"]

# 주요 메뉴: 표시 이름과 도착 페이지를 일치시킴
[[menu.main]]
identifier = "about"
name = "소개"
pageRef = "/about"
weight = 10

[[menu.main]]
identifier = "activities"
name = "활동"
pageRef = "/activities"
weight = 20

[[menu.main]]
identifier = "github"
name = "GitHub"
url = "https://github.com/won-ji1"
weight = 30
