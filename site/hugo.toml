# 한지원 포트폴리오 사이트 운영 설정
# 배포 빌드는 .github-pages.json 의 "config": "hugo.toml,pages.json" 순서로 읽습니다.
# (뒤에 오는 pages.json 이 baseURL·theme 등 배포용 값을 덮어씁니다.)

baseURL = "https://won-ji1.github.io/portfolio/"
title = "한지원"
languageCode = "ko-KR"
defaultContentLanguage = "ko"

# 사용하지 않는 태그·카테고리 페이지는 만들지 않음 (빈 목록 페이지·빈 링크 방지)
disableKinds = ["taxonomy", "term"]

copyright = "© 2026 한지원"

[params]
env = "production"
description = "로스쿨 진학을 준비하며 IT 변호사를 목표로 하는 한지원의 포트폴리오"
author = "한지원"
defaultTheme = "auto"
ShowBreadCrumbs = true
ShowToc = true
TocOpen = true
ShowReadingTime = false
ShowWordCount = false
ShowShareButtons = false
ShowPostNavLinks = false
ShowCodeCopyButtons = false
hideSummary = false
mainSections = ["activities"]

# 주요 메뉴: 표시 이름과 도착 페이지를 일치시킴
[[menu.main]]
identifier = "about"
name = "소개"
pageRef = "/about"
weight = 10

[[menu.main]]
identifier = "activities"
name = "활동"
pageRef = "/activities"
weight = 20

[[menu.main]]
identifier = "github"
name = "GitHub"
url = "https://github.com/won-ji1"
weight = 30

# 홈 첫 화면: 이름·짧은 소개·핵심 영역 바로가기
[params.homeInfoParams]
Title = "안녕하세요, 한지원입니다"
Content = """
법학을 공부하며 **로스쿨 진학**을 준비하고 있습니다. 목표는 IT 분야를 잘 아는 **IT 변호사**가 되는 것입니다.

- [자기소개 보기](about/) — 관심 분야, 학습 목표, 역량
- [활동 보기](activities/) — 대표 활동: 로스쿨 진학 준비
"""

[[params.socialIcons]]
name = "github"
title = "GitHub (won-ji1)"
url = "https://github.com/won-ji1"
